    Projects:
      - name: pywearable
        summary: In this project, we developed a library for the harmonization, analysis, and visualization of longitudinal data collected from commercial wearable devices.
        start_date: 2023
        end_date: 2025

      - name: RENEWAL
        summary: A longitudinal study with a multi-modal data collection system focused on assessing the impact of telework on well-being and carbon emissions. As part of this project, I validated the data collection system, developed the full pipeline for data processing and harmonization, and conducted the longitudinal data analysis.
        start_date: 2023
        end_date: 2025
      
      - name: EQUI-TI
        summary: Undertreatment in the Canton of Ticino - Nature, determinants, impact and downfalls. I am collaborating on this project with the Ente Ospedaliero Cantonale (EOC) and the Università della Svizzera Italiana (USI), supervising the data collection system used for the retrieval of wearable data.
        start_date: 2026

